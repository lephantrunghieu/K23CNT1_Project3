<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm/Sửa sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${book.lpthId == null} ? 'Thêm sách mới' : 'Sửa sách'"></h2>

    <form th:action="@{/books/save}" th:object="${book}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label">Tên sách:</label>
            <input type="text" th:field="*{lpthTitle}" class="form-control" placeholder="Tên sách"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Mã sách:</label>
            <input type="text" th:field="*{lpthCode}" class="form-control" placeholder="Mã sách"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Ảnh sách:</label>
            <input type="file" name="imageBook" class="form-control"/>
        </div>

        <h4>Chọn tác giả</h4>
        <div th:each="author : ${authors}" class="form-check">
            <input type="checkbox" th:id="'author-' + ${author.lpthId}"
                   th:name="authorIds" th:value="${author.lpthId}"
                   class="form-check-input author-checkbox"/>
            <label th:for="'author-' + ${author.lpthId}" th:text="${author.lpthName}" class="form-check-label"></label>

            <input type="radio" th:name="editorId" th:value="${author.lpthId}"
                   class="form-check-input editor-radio ms-3" disabled/>
            <label class="form-check-label">Chủ biên</label>
        </div>

        <button type="submit" class="btn btn-success mt-3">Lưu</button>
        <a th:href="@{/books}" class="btn btn-secondary mt-3">Hủy</a>
    </form>
</div>

<script>
    const checkboxes = document.querySelectorAll('.author-checkbox');
    const radios = document.querySelectorAll('.editor-radio');

    checkboxes.forEach(cb => {
        cb.addEventListener('change', function() {
            radios.forEach(r => r.disabled = true);
            checkboxes.forEach(cb2 => {
                if(cb2.checked) {
                    document.querySelector(`.editor-radio[value='${cb2.value}']`).disabled = false;
                }
            });
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
