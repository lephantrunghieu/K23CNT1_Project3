<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">Danh sách sách</h2>
    <a th:href="@{/books/new}" class="btn btn-primary mb-3">Thêm sách mới</a>
    <table class="table table-bordered table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>Mã sách</th>
            <th>Tên sách</th>
            <th>Ảnh</th>
            <th>Tác giả</th>
            <th>Chủ biên</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.lpthCode}"></td>
            <td th:text="${book.lpthTitle}"></td>
            <td>
                <img th:if="${book.lpthImgUrl != null}" th:src="${book.lpthImgUrl}"
                     alt="Ảnh sách" class="img-thumbnail" style="max-width: 100px;">
            </td>
            <td>
                <span th:each="ba : ${book.bookAuthors}" th:text="${ba.author.lpthName} + ' '"></span>
            </td>
            <td>
                <span th:each="ba : ${book.bookAuthors}" th:if="${ba.editor}" th:text="${ba.author.lpthName}"></span>
            </td>
            <td>
                <a th:href="@{/books/edit/{id}(id=${book.lpthId})}" class="btn btn-sm btn-warning">Sửa</a>
                <a th:href="@{/books/delete/{id}(id=${book.lpthId})}"
                   onclick="return confirm('Bạn có chắc muốn xóa?')" class="btn btn-sm btn-danger">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
