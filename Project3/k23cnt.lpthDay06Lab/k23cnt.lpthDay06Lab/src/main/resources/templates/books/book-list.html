<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Book List</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background: #ccc">
<section class="container my-3 bg-white p-3">
    <h2>Book List</h2>
    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Code</th>
            <th>Name</th>
            <th>Image</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Authors</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.lpthId}">1</td>
            <td th:text="${book.lpthCode}">Code</td>
            <td th:text="${book.lpthName}">Name</td>
            <td>
                <img th:src="@{${book.lpthImgUrl}}"
                     th:attr="alt=${book.lpthName}"
                     style="width:50px; height:50px; object-fit:cover;" />
            </td>
            <td th:text="${book.lpthQuantity}">Quantity</td>
            <td th:text="${book.lpthPrice}">Price</td>
            <td>
                <span th:each="author : ${book.lpthAuthors}"
                      class="mx-1 badge rounded-pill bg-warning text-dark"
                      th:text="${author.lpthName}">
                </span>
            </td>
            <td class="actions">
                <a th:href="@{/books/edit/{id}(id=${book.lpthId})}" class="btn btn-sm btn-primary">Edit</a>
                <a th:href="@{/books/delete/{id}(id=${book.lpthId})}"
                   onclick="return confirm('Are you sure you want to delete this book?');"
                   class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/books/new}" class="btn btn-success my-2">Add New Book</a>
</section>
</body>
</html>
